name: Build Image

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'nginx version to build and push'
        required: false
        # Update this value to change the default nginx version
        default: '1.29'
        type: string
      latest:
        description: 'Tag the image with latest?'
        required: false
        default: false
        type: boolean

env:
  NGINX_VERSION: ${{ inputs.nginx_version }}

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        repository: zooniverse/docker-nginx

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create tags
      id: create_tags
      run: |
        tag="ghcr.io/zooniverse/docker-nginx:${{ env.NGINX_VERSION }}"
        if [ "${{ inputs.latest }}" = true ]; then tag="$tag,ghcr.io/zooniverse/docker-nginx:latest"; fi
        echo $tag
        echo "tag=$tag" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.create_tags.outputs.tag }}
        build-args: |
          VERSION=${{ env.NGINX_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
